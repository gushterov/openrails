version: AppVeyor-{build}
skip_branch_with_pr: true
image: Visual Studio 2022
cache:
  - C:\ProgramData\chocolatey\bin -> .appveyor.yml
  - C:\ProgramData\chocolatey\lib -> .appveyor.yml
install:
- ps: >-
    $ErrorActionPreference = "Stop"

    Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1

    & .\dotnet-install.ps1 -Channel 10.0 -Quality GA -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet" -NoPath

    if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw ".NET 10 SDK installation failed" }

    $env:PATH="$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"

    choco install --yes --no-progress 7zip.portable xunit

    if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install all required packages - use the 're-build' option to try again" }

    (New-Object Net.WebClient).DownloadFile('https://github.com/electron/rcedit/releases/download/v1.1.1/rcedit-x86.exe', 'rcedit-x86.exe')

    $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH;C:\Program Files (x86)\Microsoft Visual Studio 14.0\VC\bin"
build_script:
- cmd: Build.cmd unstable
test: off
